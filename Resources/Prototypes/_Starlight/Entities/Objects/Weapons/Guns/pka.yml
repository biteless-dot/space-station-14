- type: entity
  name: proto-kinetic terraformer [non explosive]
  id: WeaponProtoKineticTerraformerProjectile
  parent: [WeaponProtoKineticAcceleratorBase, BaseCargoContraband]
  description: Fires kinetic bolts at a short range.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Basic/kinetilow-damage explosivc_accelerator.rsi
      layers:
        - state: icon
        - state: animation-icon
          visible: false
          map: [ "empty-icon" ]
    - type: RandomSprite
      available:
        - 0:
            icon: ""
            icon_h: ""
            icon_u: ""
      heldPrefixes:
        icon_h: "h"
        icon_u: "u"
    # todo: add itemcomponent with inhandVisuals states using unused texture and animation assets in kinetic_accelerator.rsi
    # todo: add clothingcomponent with clothingVisuals states using unused texture and animations assets in kinetic_accelerator.rsi
    - type: UpgradeableGun
      whitelist:
        tags:
          - PKAUpgrade
    - type: ContainerContainer
      containers:
        upgrades: !type:Container
    - type: BasicEntityAmmoProvider
      proto: BulletKinetic
      capacity: 1
      count: 1

- type: entity
  id: BulletKineticExplosive
  name: explosive kinetic bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
    - type: Reflective
      reflective:
        - NonEnergy
    - type: Sprite
      noRot: false
      sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
      layers:
        - state: chronobolt
          shader: unshaded
    - type: Projectile
      impactEffect: BulletImpactEffectKinetic
      damage:
        types:
          Blunt: 1
          Structural: 5
          Terrain: 30
    # Short lifespan
    - type: TimedDespawn
      lifetime: 0.275 # roughly 6.5 tiles
    - type: GatheringProjectile

# ------

- type: entity
  parent: [WeaponProtoKineticAcceleratorBase, BaseCargoContraband]
  id: WeaponProtoKineticTerraformerProjectile
  name: proto-kinetic terraformer
  description: Fires terraforming kinetic bolts at a short range.
  components:
    - type: Tag
      tags:
        - CartridgeRocket
    - type: Item
      size: Small
    - type: CartridgeAmmo
      proto: BulletRocket
      deleteOnSpawn: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: rpg
    - type: StaticPrice
      price: 20






- type: explosion
  id: TerrainCharge
  damagePerIntensity:
    types:
      Heat: 3
      Blunt: 3
      Piercing: 3
      Terrain: 30
  tileBreakChance: [ 0, 0.5, 1 ]
  tileBreakIntensity: [ 0, 10, 30 ]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  temperature: 800
