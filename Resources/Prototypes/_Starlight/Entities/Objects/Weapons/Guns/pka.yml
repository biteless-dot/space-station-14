
- type: entity
  name: proto-kinetic terraformer
  id: WeaponProtoKineticTerraformer
  parent: [WeaponProtoKineticAcceleratorBase, BaseSalvageMiningContraband]
  description: Fires terraforming kinetic impact bolts at a short range.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
      layers:
        - state: icon
        - state: animation-icon
          visible: false
          map: [ "empty-icon" ]
    - type: RandomSprite
      available:
        - 0:
            icon: ""
            icon_h: ""
            icon_u: ""
      heldPrefixes:
        icon_h: "h"
        icon_u: "u"
    - type: Gun
      fireRate: 0.4
      projectileSpeed: 15
#    - type: RechargeBasicEntityAmmo
#      rechargeCooldown: 2
    - type: UpgradeableGun
      whitelist:
        tags:
          - PKAUpgrade
    - type: ContainerContainer
      containers:
        upgrades: !type:Container
    - type: BasicEntityAmmoProvider
      proto: BulletKineticTerraformer
      capacity: 1
      count: 1

- type: entity
  id: BulletKineticTerraformer
  name: terraforming kinetic bolt
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  description: Get out of the way!
  components:
    - type: Reflective
      reflective:
        - NonEnergy
    - type: Sprite
      noRot: false
      sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
      layers:
        - state: chronobolt
          shader: unshaded
    - type: Projectile
      impactEffect: BulletImpactEffectKinetic
      damage:
        types:
          Blunt: 1
          Structural: 5
    # Short lifespan
    - type: TimedDespawn
      lifetime: 0.275 # roughly 6.5 tiles
    - type: GatheringProjectile
    - type: ExplodeOnTrigger
    - type: Explosive
      explosionType: TerraformCharge
      maxIntensity: 40
      intensitySlope: 3
      totalIntensity: 10
      maxTileBreak: 1
    - type: PointLight
      radius: 3.5
      color: blue
      energy: 0.5
    - type: RadarBlip
      color: "#44FFAA"
      scale: 1
      shape: Circle
      requireInSpace: true





