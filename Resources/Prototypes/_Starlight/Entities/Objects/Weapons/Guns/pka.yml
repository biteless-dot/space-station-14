# ammo
- type: entity
  id: BulletKineticTerraformerExplosive
  name: explosive kinetic bolt
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  description: Get out of the way!
  components:
    - type: Reflective
      reflective:
        - NonEnergy
    - type: Sprite
      noRot: false
      sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
      layers:
        - state: chronobolt
          shader: unshaded
    - type: Projectile
      impactEffect: BulletImpactEffectKinetic
      damage:
        types:
          Blunt: 25
          Structural: 30
    # Short lifespan
    - type: TimedDespawn
      lifetime: 0.275 # roughly 6.5 tiles
    - type: GatheringProjectile
    - type: ExplodeOnTrigger
    - type: Explosive
      explosionType: TerrainCharge
      maxIntensity: 40
      intensitySlope: 6
      totalIntensity: 200
      maxTileBreak: 1
    - type: PointLight
      radius: 3.5
      color: orange
      energy: 0.5
    - type: RadarBlip
      color: "#44FFAA"
      scale: 1
      shape: Circle
      requireInSpace: true





- type: explosion
  id: TerrainCharge
  damagePerIntensity:
    types:
      Heat: 3
      Blunt: 3
      Piercing: 3
      Terrain: 30
  tileBreakChance: [ 0, 0.5, 1 ]
  tileBreakIntensity: [ 0, 10, 30 ]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  temperature: 800
